<!--
  aesthetic_dna: "Sub-aquatic Market Brutalism"
  ui_paradigm: "Generative Art Canvas / Premium Podcast Identity"
  palette: "Abyss (#0B1614), Trench (#0A4A42), Bioluminescent Teal (#5DCAA5), Coral Fire (#D85A30)"
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Deep End - Podcast Cover Art</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        abyss: '#0B1614',
                        trench: '#0A4A42',
                        teal: { 500: '#5DCAA5' },
                        coral: { 500: '#D85A30' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Libre Baskerville', 'serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 60s linear infinite',
                        'spin-slow-reverse': 'spin-reverse 75s linear infinite',
                        'pulse-orb': 'pulse-scale 8s ease-in-out infinite',
                    },
                    keyframes: {
                        'spin-reverse': {
                            'from': { transform: 'rotate(360deg)' },
                            'to': { transform: 'rotate(0deg)' }
                        },
                        'pulse-scale': {
                            '0%, 100%': { transform: 'scale(1) translate(-50%, -50%)', transformOrigin: 'center center' },
                            '50%': { transform: 'scale(1.05) translate(-50%, -50%)', transformOrigin: 'center center' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- Advanced Custom Styles -->
    <style>
        /* CSS Grid Texture Generation */
        .grid-texture {
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
        }

        /* Mix-blend utilities */
        .blend-dodge { mix-blend-mode: color-dodge; }
        .blend-overlay { mix-blend-mode: overlay; }

        /* Crisp text rendering */
        .text-rendering-optimize {
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom Inset Vignette */
        .shadow-vignette {
            box-shadow: inset 0 0 120px rgba(11, 22, 20, 0.9);
        }

        /* Chromatic Outer Shadow */
        .shadow-chromatic {
            box-shadow: 0px 40px 100px -10px rgba(10, 74, 66, 0.4);
        }
    </style>
</head>
<body class="min-h-screen bg-[#050A09] flex items-center justify-center p-4 selection:bg-teal-500/30 selection:text-white">

    <div class="relative w-full max-w-[540px] aspect-square group perspective-1000">

        <main class="relative w-full h-full rounded-[32px] overflow-hidden bg-abyss shadow-chromatic ring-1 ring-white/5 border border-white/[0.02] transform transition-transform duration-700 ease-out text-rendering-optimize isolate z-10">

            <!-- LAYER 0: Noise Injection Overlay (Film Grain) -->
            <svg class="absolute inset-0 w-full h-full opacity-[0.03] blend-overlay z-0 pointer-events-none" xmlns="http://www.w3.org/2000/svg">
                <filter id="noise">
                    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/>
                </filter>
                <rect width="100%" height="100%" filter="url(#noise)"/>
            </svg>

            <!-- LAYER 1: Technical Grid Texture -->
            <div class="absolute inset-0 grid-texture z-0 pointer-events-none"></div>

            <!-- LAYER 2: Immersive Atmosphere / Light Leaks -->
            <!-- Bioluminescent Teal Pulse -->
            <div class="absolute top-[40%] left-[40%] w-[300px] h-[300px] rounded-full bg-teal-500/20 blur-[70px] mix-blend-screen animate-pulse-orb z-0 pointer-events-none"></div>

            <!-- Coral Fire Light Leak -->
            <div class="absolute -top-16 -left-16 w-[350px] h-[350px] rounded-full bg-coral-500/30 blur-[90px] blend-dodge z-0 pointer-events-none"></div>

            <!-- LAYER 3: Spatial Architecture - Concentric Rings -->
            <div class="absolute right-[-20%] bottom-[-20%] w-[120%] aspect-square z-10 pointer-events-none opacity-80">
                <!-- Outer dashed coral ring -->
                <div class="absolute inset-4 rounded-full border-[2px] border-dashed border-coral-500/20 animate-spin-slow"></div>
                <!-- Mid solid teal ring -->
                <div class="absolute inset-20 rounded-full border border-teal-500/30 animate-spin-slow-reverse"></div>
                <!-- Inner solid teal ring -->
                <div class="absolute inset-36 rounded-full border border-teal-500/15 animate-spin-slow"></div>
                <!-- Core ghost ring -->
                <div class="absolute inset-[240px] rounded-full border border-white/5 animate-spin-slow-reverse"></div>
            </div>

            <!-- LAYER 4: Inset Deep Scene Vignette -->
            <div class="absolute inset-0 shadow-vignette z-20 pointer-events-none"></div>

            <!-- LAYER 5: Content Architecture -->
            <div class="relative z-30 h-full p-10 flex flex-col justify-between pointer-events-none">

                <!-- Brand HUD -->
                <header class="flex justify-between items-start w-full">
                    <!-- Brand Mark: Sailboat -->
                    <div class="flex items-center gap-3">
                        <svg class="w-8 h-8 drop-shadow-md" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="4" y="26" width="24" height="2" fill="#5DCAA5" />
                            <path d="M14 6L6 24H14V6Z" fill="#5DCAA5" />
                            <path d="M16 10L24 24H16V10Z" fill="#D85A30" style="filter: drop-shadow(0 0 8px rgba(216,90,48,0.6));" />
                        </svg>
                    </div>

                    <!-- Meta Label -->
                    <div class="px-3 py-1.5 rounded-full ring-1 ring-teal-500/20 bg-teal-500/[0.03] backdrop-blur-md">
                        <span class="font-sans font-medium text-[10px] tracking-[0.2em] text-teal-500/60 uppercase">Vol. 01 / Q2_Mkts</span>
                    </div>
                </header>

                <!-- Core Typography -->
                <article class="flex flex-col mt-auto mb-16 pl-2">
                    <span class="font-sans text-[12px] font-medium tracking-[0.45em] text-teal-500/90 uppercase mb-4 ml-1">
                        The
                    </span>
                    <h1 class="font-serif font-bold text-[78px] text-white leading-[0.82] tracking-[-0.03em] flex flex-col drop-shadow-2xl selection:bg-coral-500/30">
                        <span class="relative">
                            DEEP
                            <div class="absolute left-[-24px] top-[15%] h-[70%] w-[2px] bg-gradient-to-b from-teal-500/80 to-transparent rounded-full"></div>
                        </span>
                        <span class="text-white/95">END</span>
                    </h1>
                </article>

                <!-- Footer / Tagline -->
                <footer class="w-full pt-6 border-t border-white/10 flex justify-between items-center relative">
                    <div class="absolute top-0 left-0 w-1/3 h-[1px] bg-gradient-to-r from-teal-500/40 to-transparent"></div>

                    <p class="font-sans font-light text-[11.5px] tracking-[0.16em] text-white/50 uppercase">
                        Market Intelligence <span class="mx-2 text-white/20">|</span> Coral Reef Capital
                    </p>

                    <div class="flex gap-1">
                        <div class="w-1 h-1 rounded-full bg-teal-500/40"></div>
                        <div class="w-1 h-1 rounded-full bg-coral-500/40"></div>
                        <div class="w-1 h-1 rounded-full bg-white/20"></div>
                    </div>
                </footer>

            </div>

        </main>

        <!-- Floor reflection -->
        <div class="absolute -bottom-8 left-[5%] w-[90%] h-8 bg-trench/30 blur-2xl rounded-[100%] z-0"></div>
    </div>

</body>
</html>
