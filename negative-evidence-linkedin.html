<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Negative Evidence - LinkedIn Post</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 675px;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    .slide {
      position: relative;
      width: 100%;
      height: 100%;
      background: #080a0d;
      color: #fff;
      overflow: hidden;
    }
    .slide::before {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      left: auto;
      width: 50%;
      background: url('reef_01_wide.png') center/cover;
      filter: grayscale(1) invert(1) contrast(1.1);
      opacity: 0.72;
    }
    .slide::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: auto;
      bottom: 0;
      width: auto;
      height: 5px;
      background: linear-gradient(90deg, #c6694b, #d4af37, #2d6962);
    }
    .topline, .deckmeta, .footer {
      position: absolute;
      z-index: 2;
      font: 700 11px/1 "IBM Plex Mono", monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .topline {
      top: 42px;
      left: 52px;
    }
    .deckmeta {
      top: 42px;
      right: 52px;
      text-align: right;
    }
    .headline {
      position: absolute;
      z-index: 2;
      left: 56px;
      right: 53%;
      top: 160px;
      font-size: 58px;
      line-height: 0.92;
      letter-spacing: -0.055em;
      font-weight: 920;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .subline {
      position: absolute;
      z-index: 2;
      left: 56px;
      bottom: 70px;
      max-width: 570px;
      right: auto;
      font-size: 18px;
      line-height: 1.25;
      color: inherit;
      opacity: 0.74;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .footer {
      left: 42px;
      right: 42px;
      bottom: 24px;
      display: flex;
      justify-content: space-between;
      color: rgba(246, 243, 238, 0.64);
    }
  </style>
</head>
<body>
  <section class="slide">
    <div class="topline">Coral Reef Capital</div>
    <div class="deckmeta">negative space</div>
    <div class="headline">A sharper lens on overlooked assets.</div>
    <div class="subline">Inverted evidence image, controlled accent strip.</div>
    <div class="footer"><span>screening discipline</span><span>original effect preserved</span></div>
  </section>
</body>
</html>
